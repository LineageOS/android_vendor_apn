exclude:
  # Streaming duplicates Internet; credentials and connection fields match, APN differs only in case.
  - match:
      carrier: Zain JO Streaming
      carrier_id: "1578"
      mcc: "416"
      mnc: "01"
      apn: Zain
      authtype: "1"
      type: [default, ia, supl]
  # Skinny Data duplicates Default; Content and MMS are separate profiles.
  - match:
      carrier: Data
      carrier_id: "2105"
      mcc: "530"
      mnc: "05"
      apn: wapaccess.co.nz
      type: [default, ia, supl]
      mvno_type: spn
      mvno_match_data: Skinny
      proxy: null
      port: null
  # Keep equivalent MASMOVIL, which also supports dun; SPN matching ignores case.
  - match:
      carrier: MASMovil Internet
      carrier_id: "2300"
      mcc: "214"
      mnc: "03"
      apn: internetmas
      type: [default, ia, supl]
      mvno_type: spn
      mvno_match_data: MASMovil
  # Keep equivalent Orange Internet, which also supports supl.
  - match:
      carrier: Orange net KE
      carrier_id: "2210"
      mcc: "639"
      mnc: "07"
      apn: bew.orange.co.ke
      type: [default, ia]
  # Keep Willkommen; only the display label and case-insensitive SPN spelling differ.
  - match:
      carrier: WILLKOMMEN
      carrier_id: null
      mcc: "262"
      mnc: "02"
      apn: web.vodafone.de
      type: [default, ia, supl]
      mvno_type: spn
      mvno_match_data: WILLKOMMEN
  # Keep Korek 9595; Korek 9494 has identical connection settings and service types.
  - match:
      carrier: Korek 9494
      carrier_id: "1983"
      mcc: "418"
      mnc: "40"
      apn: internet.korek.com
      type: [default, ia, supl]

